[package]
name = "understory_overlay"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless overlay lifecycle and interaction state for Understory and Overstory."
readme = "README.md"
keywords = ["overlay", "popover", "menu", "ui", "no-std"]
categories = ["gui", "no-std"]

[features]
default = ["libm"]
libm = ["kurbo/libm", "understory_anchor/libm"]
std = ["kurbo/std", "understory_anchor/std"]
serde = ["dep:serde", "kurbo/serde", "understory_anchor/serde"]

[dependencies]
kurbo.workspace = true
serde = { workspace = true, optional = true }
understory_anchor.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
