[package]
name = "understory_tiling"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Headless tiling, docking, and layout interaction primitives."
keywords = ["tiling", "docking", "layout", "ui", "no_std"]
categories = ["gui", "data-structures", "no-std"]

[dependencies]
kurbo.workspace = true
serde = { workspace = true, optional = true }

[lints]
workspace = true

[features]
default = ["std"]

# Default builds use `std`. For `no_std` + `alloc`, disable default features and
# enable `libm` for Kurbo geometry math.
std = ["kurbo/std"]
libm = ["kurbo/libm"]
serde = ["dep:serde", "kurbo/serde"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
