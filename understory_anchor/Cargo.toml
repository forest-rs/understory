[package]
name = "understory_anchor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless anchored overlay geometry resolution for Understory and Overstory."
readme = "README.md"
keywords = ["anchor", "overlay", "geometry", "ui", "no-std"]
categories = ["gui", "graphics", "no-std"]

[features]
default = ["libm"]
libm = ["kurbo/libm"]
std = ["kurbo/std"]
serde = ["dep:serde", "kurbo/serde"]

[dependencies]
kurbo.workspace = true
serde = { workspace = true, optional = true }

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []
